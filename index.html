<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LUA HUB</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    background:radial-gradient(circle at center,#0a2a0a 0%,#000 100%);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Courier New',monospace;
    color:#00ff88;
    overflow:hidden;
    padding:20px;
}
body::before{
    content:'';
    position:fixed;
    inset:0;
    background:repeating-conic-gradient(
        from 0deg,
        rgba(0,255,136,0.05) 0deg 15deg,
        transparent 15deg 30deg
    );
    pointer-events:none;
}
.card{
    background:#0a1a0a;
    border:3px solid #00ff88;
    border-radius:24px;
    padding:36px 28px;
    max-width:400px;
    width:100%;
    text-align:center;
    box-shadow:0 0 80px rgba(0,255,136,0.45);
    position:relative;
    z-index:2;
}
.title{
    font-size:30px;
    letter-spacing:8px;
    font-weight:bold;
    text-shadow:0 0 30px #00ff88;
    margin-bottom:24px;
}
.badge{
    display:inline-block;
    background:#00ff88;
    color:#000;
    padding:10px 24px;
    border-radius:30px;
    font-size:14px;
    font-weight:bold;
    letter-spacing:3px;
    box-shadow:0 0 40px #00ff88;
    margin-bottom:20px;
}
.lock{
    font-size:70px;
    margin-bottom:16px;
    filter:drop-shadow(0 0 20px #00ff88);
}
.sub{
    font-size:14px;
    opacity:0.85;
    letter-spacing:2px;
    margin-top:14px;
}
.hint{
    font-size:12px;
    opacity:0.5;
    margin-top:24px;
}
.blink{
    animation:blink 1.6s infinite;
}
@keyframes blink{
    0%,50%{opacity:1}
    51%,100%{opacity:0.35}
}
</style>
</head>
<body>
<div class="card">
    <div class="lock">🔒</div>
    <div class="title">LUA HUB</div>
    <div class="badge">PRIVATE • NO ACCESS</div>
    <div class="sub blink">КОД ЗАБЛОКИРОВАН</div>
    <div class="hint">исходников тут нет.</div>
</div>
</body>
</html>
